<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Aula · Organizador universitario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F4F4FA;--card:#FFFFFF;--card-2:#F0F0F8;--ink:#15162B;--ink-2:#3B3F5A;--ink-3:#5F6482;--line:#E2E2EE;--edge:rgba(40,40,90,.06);--fs:17px;
  --navy:#5B4BE8;--navy-2:#8B5CF6;--navy-3:#EC4899;--on-navy:#FFFFFF;--on-navy-2:rgba(255,255,255,.78);
  --sun:#FFD166;--blue:#4F46E5;--red:#EF4466;--green:#16A37A;--amber:#F59E0B;--t-blue:#E9E8FF;--t-green:#DDF7EE;--t-amber:#FFF1DA;--t-pink:#FFE4F0;--t-sky:#E0F2FE;
  --r:20px;--tab:66px;--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.14);
  box-sizing:border-box;padding:0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F0F1A;--card:#1A1A2B;--card-2:#222237;--ink:#F5F5FC;--ink-2:#C9CBDD;--ink-3:#9EA2BC;--line:#30304A;--edge:#2A2A44;--navy:#6D5DF0;--navy-2:#9D6BFF;--navy-3:#F472B6;--sun:#FFD166;--t-blue:rgba(99,91,255,.18);--t-green:rgba(22,163,122,.18);--t-amber:rgba(245,158,11,.18);--t-pink:rgba(236,72,153,.18);--t-sky:rgba(14,165,233,.18);--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--paper:#0F0F1A;--card:#1A1A2B;--card-2:#222237;--ink:#F5F5FC;--ink-2:#C9CBDD;--ink-3:#9EA2BC;--line:#30304A;--edge:#2A2A44;--navy:#6D5DF0;--navy-2:#9D6BFF;--navy-3:#F472B6;--sun:#FFD166;--t-blue:rgba(99,91,255,.18);--t-green:rgba(22,163,122,.18);--t-amber:rgba(245,158,11,.18);--t-pink:rgba(236,72,153,.18);--t-sky:rgba(14,165,233,.18);--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6)}
html{-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:var(--fs);line-height:1.6;font-weight:500;height:100%;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0;position:relative;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.page{max-width:640px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-right,0px)) 0 calc(16px + env(safe-area-inset-left,0px))}
h1{font-size:1.75em;font-weight:800;letter-spacing:-.025em;line-height:1.12}
h2{font-size:1.2em;font-weight:800;letter-spacing:-.015em;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:18px;border-radius:4px;background:linear-gradient(var(--navy),var(--navy-3));flex:none}
h2 small{font-weight:700;color:var(--ink-3);font-size:.78em;margin-left:6px}
h3{font-size:15px;font-weight:800}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:.94em;line-height:1.5}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid var(--edge)}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.86em;font-weight:700;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card-2);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 8px 20px -10px rgba(91,75,232,.6)}
.btn.blue{background:var(--blue);color:#fff}
.btn.soft{background:var(--t-blue);color:var(--navy)}
.btn.danger{background:rgba(229,72,77,.12);color:var(--red)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.topbar h1{font-size:1.5em}
.iconbtn{width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
/* Hero */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 58%,var(--navy-3) 135%);color:var(--on-navy);border-radius:24px;padding:18px 18px 22px;margin:16px 0 0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-30px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,209,102,.22)}
@media (max-width:420px){.hero .sync span{display:none}}
.hero .hbtn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.hero .hbtn svg{width:18px;height:18px}
.hero .hello{font-size:1.05em;font-weight:700;color:rgba(255,255,255,.9);margin-top:14px}
.hero .hello+.status{margin-top:6px}
.hero>*{position:relative;z-index:1}
.hero .date{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--on-navy-2);font-size:.84em;font-weight:700}
.hero .status{margin-top:16px;font-size:.9em;font-weight:800;color:var(--sun);display:flex;align-items:center;gap:8px}
.hero .status .pulse{width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 0 rgba(255,196,61,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,196,61,.6)}70%{box-shadow:0 0 0 10px rgba(255,196,61,0)}100%{box-shadow:0 0 0 0 rgba(255,196,61,0)}}
.hero .big{font-size:1.9em;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-top:8px}
.hero .meta{color:rgba(255,255,255,.88);font-size:1em;margin-top:10px;font-weight:600;line-height:1.45}
.hero .bar{height:6px;background:rgba(255,255,255,.14);border-radius:4px;margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--sun);border-radius:4px;transition:width .6s}
.hero .count{display:flex;justify-content:space-between;font-size:.86em;color:rgba(255,255,255,.88);margin-top:6px;font-weight:700}
.sync{display:inline-flex;align-items:center;gap:6px}
.acct{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.acct img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.2)}
.hero .acct>span{display:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--card-2);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.cloud .d{background:var(--green)}
.sync.error .d{background:var(--red)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;border:1px solid var(--edge)}
.stat b{display:block;font-size:1.5em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:.86em;color:var(--ink-2);font-weight:700;line-height:1.3;display:block;margin-top:2px}
.stat.c1{background:var(--t-blue)}.stat.c2{background:var(--t-green)}.stat.c3{background:var(--t-amber)}
.stat .em{font-size:16px;line-height:1;margin-bottom:6px;display:block}
/* Class rows */
.cls{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 14px 12px;margin-top:10px;border:1px solid var(--edge)}
.cls .bar{width:5px;border-radius:4px;flex:none}
.cls .time{width:62px;flex:none;font-weight:800;font-size:1em;line-height:1.2}
.cls .time small{display:block;color:var(--ink-3);font-weight:700;font-size:.88em;margin-top:2px}
.cls .name{font-weight:800;font-size:1.05em;line-height:1.3}
.cls .info{color:var(--ink-2);font-size:.94em;margin-top:4px;line-height:1.45}
.cls.now{outline:2px solid var(--sun)}
.cls.past{opacity:.6}
.att{display:flex;gap:6px;margin-top:10px}
.cls .att{flex-basis:100%;margin-top:0}
@media (max-width:400px){.att button{font-size:.8em;padding:6px 2px}}
.att button{flex:1;padding:10px 6px;border-radius:12px;font-size:.9em;font-weight:700;background:var(--card-2);color:var(--ink-2)}
.att button.on-p{background:var(--t-green);color:var(--green)}
.att button.on-a{background:var(--t-pink);color:var(--red)}
.att button.on-j{background:var(--t-amber);color:var(--amber)}
/* Tasks */
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:10px;border:1px solid var(--edge)}
.task .box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.task .box svg{width:14px;height:14px;display:none}
.task.done .box{background:var(--green);border-color:var(--green);color:#fff}
.task .m .ty{display:inline-flex;align-items:center;gap:4px}
.task.done .box svg{display:block}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.task .t{font-weight:800;font-size:1.05em;line-height:1.35}
.task .m{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px;align-items:center;font-size:.9em;color:var(--ink-2);font-weight:700}
.task .m .late{color:var(--red)}
.task .pri{width:6px;height:6px;border-radius:50%;flex:none;margin-top:9px}
.task .pri.p2{background:var(--red)}.task .pri.p1{background:var(--amber)}.task .pri.p0{background:transparent}
.grp{margin-top:22px;font-size:.92em;font-weight:800;color:var(--ink-3);letter-spacing:.01em}
.grp.late{color:var(--red)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;-ms-overflow-style:none;scroll-padding:0 16px}
.filters::after,.tabs2::after{content:"";flex:none;width:1px}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:.94em;border:1px solid var(--edge);font-weight:700;color:var(--ink-2);white-space:nowrap}
.filters button.on{background:var(--navy);color:var(--on-navy)}
/* Day strip */
.days{display:flex;gap:6px;margin:8px 0 4px}
.days button{flex:1;padding:11px 0 9px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:1em;border:1px solid var(--edge);color:var(--ink-2);line-height:1.1}
.days button small{display:block;font-size:.76em;color:var(--ink-3);font-weight:700;margin-top:2px}
.days button.on{background:var(--navy);color:var(--on-navy)}
.days button.on small{color:var(--on-navy-2)}
.days button.today:not(.on){box-shadow:inset 0 0 0 2px var(--sun)}
.seg{display:inline-flex;background:var(--card-2);border-radius:10px;padding:3px}
.seg button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* Week grid */
.tt{overflow-x:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 8px 12px;border:1px solid var(--edge)}
.tt-in{display:grid;grid-template-columns:34px repeat(var(--cols),minmax(58px,1fr));gap:3px;min-width:100%}
.tt .hd{font-size:.78em;font-weight:800;color:var(--ink-3);text-align:center;padding-bottom:4px}
.tt .hd.today{color:var(--ink)}
.tt .col{position:relative;height:var(--h);background:var(--card-2);border-radius:8px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour))}
.tt .hours{position:relative;height:var(--h)}
.tt .hours span{position:absolute;left:0;right:0;font-size:10px;font-weight:700;color:var(--ink-3);text-align:right;padding-right:4px;transform:translateY(-6px)}
.tt .blk{position:absolute;left:2px;right:2px;border-radius:7px;padding:4px 5px;font-size:10px;line-height:1.2;color:#fff;overflow:hidden;font-weight:800;cursor:pointer}
.tt .blk small{display:block;font-weight:600;opacity:.85;font-size:9px;margin-top:1px}
/* Calendar */
.cal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border:1px solid var(--edge)}
.cal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .nav b{font-size:16px;font-weight:800;text-transform:capitalize}
.cal .wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--ink-3);font-weight:800;text-align:center;margin-bottom:4px}
.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .day{min-width:0;padding:0}
.cal .day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;color:var(--ink)}
.cal .day.out{color:var(--ink-3);opacity:.5}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--sun)}
.cal .day.sel{background:var(--navy);color:var(--on-navy)}
.cal .day.hol{color:var(--red)}
.cal .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.cal .day.hascls::before{content:"";position:absolute;top:4px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--ink-3);opacity:.6}
/* Subjects */
.subj{display:flex;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:10px;align-items:center;border:1px solid var(--edge)}
.subj .ab{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}
.subj .n{font-weight:800;font-size:1.05em;line-height:1.25}
.subj .s{font-size:.9em;color:var(--ink-2);margin-top:2px;font-weight:700}
.subj .k{text-align:right;flex:none}
.subj .k b{display:block;font-size:17px;font-weight:800}
.subj .k span{font-size:11px;color:var(--ink-3);font-weight:700}
.shead{border-radius:24px;margin:16px 0 0;padding:16px 18px 20px;color:#fff;position:relative}
.shead h1{font-size:24px}
.shead .sub{color:rgba(255,255,255,.8);margin-top:4px}
.shead .backrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.shead .backrow button{color:#fff;background:rgba(255,255,255,.18);border-radius:10px;height:36px;padding:0 12px;font-weight:700;font-size:.88em}
.tabs2{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;border:1px solid var(--edge);color:var(--ink-2);white-space:nowrap}
.tabs2 button.on{background:var(--navy);color:var(--on-navy)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:.96em}
.kv dt{color:var(--ink-3);font-weight:700;font-size:.9em}
.kv dd{font-weight:600;word-break:break-word}
.grade-big{display:flex;gap:10px;margin-top:10px}
.grade-big .g{flex:1;min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border:1px solid var(--edge)}
.grade-big .g b{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.grade-big .g span{font-size:.86em;color:var(--ink-2);font-weight:700}
.ev{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .w{font-size:.88em;color:var(--ink-3);font-weight:700;margin-top:2px}
.ev .g{font-weight:800;font-size:17px;min-width:44px;text-align:right}
.ev .g.na{color:var(--ink-3);font-weight:700;font-size:13px}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.needs div{background:var(--card-2);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.needs b{display:block;font-size:1.1em;font-weight:800;line-height:1.15;word-break:break-word}
.needs span{font-size:.82em;color:var(--ink-2);font-weight:700}
.sess{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.96em}
.sess:last-child{border-bottom:0}
.sess{flex-wrap:wrap}
.sess .att{margin:0;flex:none;width:100%}
@media (min-width:1100px){.sess{flex-wrap:nowrap}.sess .att{width:260px}}
textarea.notes{width:100%;min-height:220px;border:0;background:transparent;resize:vertical;line-height:1.5;outline:none}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2);font-weight:600;font-size:.96em;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .em{font-size:34px;display:block;margin-bottom:8px;line-height:1}
.empty .btn{margin-top:14px}
/* Tab bar */
.tabbar{position:static;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:flex;height:var(--tab)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74em;font-weight:800;color:var(--ink-3)}
.tabbar button .ic{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ic{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .tabbar button.on .ic{background:var(--sun);color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar button.on .ic{background:var(--sun);color:#111}}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 16px);width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;box-shadow:0 10px 26px -8px rgba(91,75,232,.7);z-index:41;display:flex;align-items:center;justify-content:center;transition:transform .15s}

<script>
/* ===================== Utilidades ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const dow=d=>{const n=d.getDay();return n===0?7:n};
const toMin=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DAYS_S=['','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS_1=['','L','M','X','J','V','S','D'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MONTHS_S=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PALETTE=['#6366F1','#F43F5E','#10B981','#F59E0B','#8B5CF6','#0EA5E9','#EC4899','#14B8A6','#F97316','#84CC16','#3B82F6','#A855F7'];
const TYPES={tarea:'Tarea',entrega:'Entrega',examen:'Examen',lectura:'Lectura',tutoria:'Tutoría',otro:'Otro'};
const ETYPES=['Examen','Parcial','Final','Test','Práctico','Oral','Recuperación'];
const examTitle=t=>{const s=getSubject(t.subjectId);return (t.etype||'Examen')+(s?' · '+(s.short||s.name):'')};
const TYPE_ICON={tarea:'✏️',entrega:'📤',examen:'📝',lectura:'📖',tutoria:'🧑‍🏫',otro:'📌'};
function greeting(){const h=new Date().getHours();return h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches'}
const KINDS={teoria:'Teoría',practica:'Práctica',seminario:'Seminario',laboratorio:'Laboratorio',tutoria:'Tutoría'};
const STYPE={BA:'Básica',OB:'Obligatoria',OP:'Optativa'};
const SEM_NAME=new Proxy({},{get:(_,k)=>k==='anual'?'Anual':((state.settings.semesters||[]).find(s=>s.id===k)||{}).name||String(k)});
const semIds=()=>state.settings.semesters.map(s=>s.id);
const semShort=id=>id==='anual'?'Anual':(String(semIds().indexOf(id)+1)+'º');
const STYPE_ALL={BA:'Básica',OB:'Obligatoria',OP:'Optativa',PE:'Prácticas',TFG:'TFG'};
function courseLabelOf(p){const parts=[];if(p.year)parts.push(p.year+'º');if(p.degree)parts.push(p.degree);const a=parts.join(' ');return (a?a:'Mi curso')+(p.university?' · '+p.university:'')}
function courseLabel(){const p=state.settings.profile||{};const parts=[];if(p.year)parts.push(p.year+'º');if(p.degree)parts.push(p.degree);const a=parts.join(' ');return (a?a:'Mi curso')+(p.university?' · '+p.university:'')}
function makeSemesters(kind,yearStart){const y=yearStart||new Date().getFullYear();const Y=y+1;if(kind==='anual')return[{id:'s1',name:'Curso anual',start:y+'-09-14',end:Y+'-06-30'}];if(kind==='trimestre')return[{id:'s1',name:'1º trimestre',start:y+'-09-14',end:y+'-12-20'},{id:'s2',name:'2º trimestre',start:Y+'-01-08',end:Y+'-03-31'},{id:'s3',name:'3º trimestre',start:Y+'-04-06',end:Y+'-06-30'}];const n=kind==='semestre'?'semestre':'cuatrimestre';return[{id:'s1',name:'1º '+n,start:y+'-09-14',end:Y+'-01-31'},{id:'s2',name:'2º '+n,start:Y+'-02-01',end:Y+'-06-30'}]}
function fmtDate(iso,withYear){if(!iso)return 'Sin fecha';const d=parseISO(iso);let s=DAYS_S[dow(d)]+' '+d.getDate()+' '+MONTHS_S[d.getMonth()];if(withYear||d.getFullYear()!==new Date().getFullYear())s+=' '+d.getFullYear();return s}
function fmtLong(iso){const d=parseISO(iso);return DAYS[dow(d)]+' '+d.getDate()+' de '+MONTHS[d.getMonth()]}
function daysDiff(iso){const a=parseISO(todayISO()),b=parseISO(iso);return Math.round((b-a)/86400000)}
function relDay(iso){const n=daysDiff(iso);if(n===0)return 'Hoy';if(n===1)return 'Mañana';if(n===-1)return 'Ayer';if(n<0)return 'Hace '+(-n)+' días';if(n<7)return DAYS[dow(parseISO(iso))];return 'En '+n+' días'}
function fmtDur(min){if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return m?h+' h '+m+' min':h+' h'}
function n1(x){return x==null||isNaN(x)?'–':(Math.round(x*100)/100).toLocaleString('es-ES',{maximumFractionDigits:2})}
function initials(s){const w=(s.name||'').split(/[\s\-\/]+/).filter(x=>x.length>2&&!/^(de|del|la|las|los|el|y|e|a|al|en|para|por)$/i.test(x));const r=w.slice(0,3).map(x=>x[0]).join('').toUpperCase();return r||(s.short||s.name||'?').slice(0,2).toUpperCase()}
function nextClassFrom(iso){const nowM=new Date().getHours()*60+new Date().getMinutes();for(let i=0;i<21;i++){const d=addDays(iso,i);const cls=classesOn(d).filter(c=>i>0||toMin(c.start)>nowM);if(cls.length)return{iso:d,cls:cls[0],days:i}}return null}
function textColor(hex){const c=hex.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*299+g*587+b*114)/1000>160?'#111':'#fff'}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ===================== Estado ===================== */
let LS_KEY='aula.uni.v1';const LS_LEGACY='aula.uni.v1',LS_LAST='aula.uni.last';const keyFor=id=>'aula.uni.v1.'+id;
function defaultState(){return {v:1,updatedAt:0,
 settings:{course:'',profile:{university:'',degree:'',year:1,periods:'cuatrimestre',setup:false,name:''},semesters:[{id:'s1',name:'1º cuatrimestre',start:'2026-09-14',end:'2027-01-31'},{id:'s2',name:'2º cuatrimestre',start:'2027-02-01',end:'2027-06-30'}],dayStart:8,dayEnd:21,showSat:false,minAttendance:80,theme:'auto',holidays:[],activeSemester:'auto',hideTemplate:false,weeklyGoal:10,textSize:'normal'},
 subjects:[],classes:[],tasks:[],attendance:{},notes:{},study:[],plans:[],planDone:{}}}
let state=defaultState();
function normalize(s){const d=defaultState(),D=defaultState();const out=Object.assign(d,s||{});out.settings=Object.assign(D.settings,(s&&s.settings)||{});if(!Array.isArray(out.settings.holidays))out.settings.holidays=[];if(!Array.isArray(out.settings.semesters)||!out.settings.semesters.length)out.settings.semesters=defaultState().settings.semesters;out.settings.semesters.forEach((s,i)=>{s.id='s'+(i+1);if(!s.name)s.name=(i+1)+'º periodo'});out.settings.profile=Object.assign({university:'',degree:'',year:1,periods:'cuatrimestre',setup:false},out.settings.profile||{});
 // Migración: cuentas creadas con la versión inicial (2º ADE UCAM)
 if(!out.settings.profile.setup&&(out.settings.course||'').indexOf('ADE')>=0){out.settings.profile={university:'UCAM',degree:'Grado en ADE',year:2,periods:'cuatrimestre',setup:true}}
 if(out.settings.profile.setup)out.settings.course=courseLabelOf(out.settings.profile);['subjects','classes','tasks'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[]});const ids=out.settings.semesters.map(s=>s.id);out.subjects.forEach(s=>{if(s.semester!=='anual'&&!ids.includes(s.semester))s.semester=ids[0]});if(!out.attendance||typeof out.attendance!=='object')out.attendance={};if(!out.notes||typeof out.notes!=='object')out.notes={};if(!Array.isArray(out.study))out.study=[];if(!Array.isArray(out.plans))out.plans=[];if(!out.planDone||typeof out.planDone!=='object')out.planDone={};if(out.settings.weeklyGoal==null)out.settings.weeklyGoal=10;if(!out.settings.textSize)out.settings.textSize='normal';return out}
function loadLocal(){try{const last=localStorage.getItem(LS_LAST);if(last)LS_KEY=keyFor(last);const r=localStorage.getItem(LS_KEY);if(r)state=normalize(JSON.parse(r))}catch(e){}}
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function save(){state.updatedAt=Date.now();persistLocal();scheduleCloud()}

/* ===================== Configuración (rellena con tu proyecto de Supabase) ===================== */
const SUPABASE_URL='https://hoevbiwbhnymzvfqwsla.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_GsMAIZprQtY03dysiXTCEw_0VQmDDOn';
const AI_FUNCTION='sugerir'; // nombre de la Edge Function (opcional)
const APP_VERSION='1.18';const APP_DATE='10 oct 2026';

/* ===================== Sincronización (Supabase, una fila por usuario) ===================== */
const SB_CONFIGURED=/^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL)&&!!SUPABASE_ANON_KEY&&SUPABASE_ANON_KEY!=='TU_ANON_KEY';
let sb=null;
function makeClient(){if(sb||!SB_CONFIGURED||!window.supabase||typeof window.supabase.createClient!=='function')return sb;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){console.warn('supabase',e)}return sb}
function ensureSupabase(){return new Promise(res=>{if(makeClient())return res(sb);if(!SB_CONFIGURED)return res(null);const s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.onload=()=>res(makeClient());s.onerror=()=>res(null);document.head.appendChild(s)})}
const cloud={ready:false,writing:false,pending:false,status:'local',timer:null,me:null,id:null,chan:null};
const SYNC_LABEL={cloud:'Guardado en tu cuenta',error:'Sin sincronizar',readonly:'Solo lectura en la nube',local:'Solo este dispositivo'};
function setSync(s){cloud.status=s;document.querySelectorAll('.sync').forEach(el=>{el.className='sync '+s;el.querySelector('span').textContent=SYNC_LABEL[s]||s})}
function showAuth(on){$('#auth').classList.toggle('open',!!on);if(on){setTimeout(()=>{const e=$('#au-email');if(e&&window.innerWidth>700)e.focus()},50)}}
function authMsg(t){const m=$('#au-msg');if(m)m.textContent=t||''}
async function authSignIn(){if(!sb)return;const email=val('au-email'),password=$('#au-pass').value;if(!email||!password){authMsg('Escribe tu email y contraseña');return}authMsg('Entrando…');const {error}=await sb.auth.signInWithPassword({email,password});if(error){authMsg(error.message==='Invalid login credentials'?'Email o contraseña incorrectos':error.message);return}authMsg('')}
let auMode='in';
function authMode(m){auMode=m;$('#au-tab-in').classList.toggle('on',m==='in');$('#au-tab-up').classList.toggle('on',m==='up');$('#au-name-f').style.display=m==='up'?'':'none';$('#au-in').textContent=m==='up'?'Crear mi cuenta':'Entrar';$('#au-links').style.display=m==='up'?'none':'';$('#au-pass').setAttribute('autocomplete',m==='up'?'new-password':'current-password');authMsg('');if(m==='up'&&window.innerWidth>700)$('#au-name').focus()}
function authSubmit(){auMode==='up'?authSignUp():authSignIn()}
async function authSignUp(){if(!sb)return;const name=val('au-name'),email=val('au-email'),password=$('#au-pass').value;if(!name){authMsg('Dinos tu nombre');return}if(!email||!password||password.length<6){authMsg('Pon un email y una contraseña de al menos 6 caracteres');return}authMsg('Creando cuenta…');const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});if(error){authMsg(/already registered|already exists/i.test(error.message)?'Ese email ya tiene cuenta: pulsa Entrar':error.message);return}if(data&&data.session){authMsg('')}else authMsg('Cuenta creada. Te hemos enviado un correo: pulsa el enlace para activarla y vuelve aquí.')}
async function authMagic(){if(!sb)return;const email=val('au-email');if(!email){authMsg('Escribe tu email y vuelve a pulsar');return}authMsg('Enviando…');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});authMsg(error?error.message:'Te hemos enviado un enlace: ábrelo desde este dispositivo.')}
async function authReset(){if(!sb)return;const email=val('au-email');if(!email){authMsg('Escribe tu email y vuelve a pulsar');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});authMsg(error?error.message:'Te hemos enviado un correo para cambiar la contraseña.')}
async function authGoogle(){if(!sb)return;authMsg('');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)authMsg(error.message)}
async function authSignOut(){if(!sb)return;await sb.auth.signOut();}
function sessionName(u){const md=(u&&u.user_metadata)||{};const n=md.full_name||md.name||'';if(n)return n;const e=(u&&u.email)||'';return e?e.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):''}
async function initCloud(){
 await ensureSupabase();
 if(!sb){setSync('local');if(SB_CONFIGURED){toast('No se pudo cargar el sistema de cuentas. Revisa tu conexión y recarga.')}return}
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(session)await onSession(session);else{showAuth(true);setSync('local')}
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>openSheet('Nueva contraseña',`<label class="field" style="margin-top:0"><span>Contraseña nueva</span><input id="np" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label>`,()=>{const p=$('#np').value;if(p.length<6){toast('Mínimo 6 caracteres');return false}sb.auth.updateUser({password:p}).then(({error})=>toast(error?error.message:'Contraseña cambiada'));return true}),200)}
   if(ev==='SIGNED_OUT'||!s){cloud.id=null;cloud.ready=false;cloud.me=null;if(cloud.chan){try{sb.removeChannel(cloud.chan)}catch(e){}cloud.chan=null}state=defaultState();LS_KEY=LS_LEGACY;try{localStorage.removeItem(LS_LAST)}catch(e){}setSync('local');render();showAuth(true);return}if(s&&s.user&&s.user.id!==cloud.id)onSession(s)});
 }catch(e){console.warn('auth',e);setSync('error')}
}
async function onSession(session){
 const u=session.user;const id=u.id;showAuth(false);authMsg('');
 cloud.id=id;cloud.me={name:(state.settings.profile&&state.settings.profile.name)||sessionName(u),email:u.email||'',avatarUrl:(u.user_metadata&&(u.user_metadata.avatar_url||u.user_metadata.picture))||''};
 const firstTimeHere=!localStorage.getItem(keyFor(id));
 const last=localStorage.getItem(LS_LAST);
 if(last!==id){const own=localStorage.getItem(keyFor(id));const legacy=localStorage.getItem(LS_LEGACY);
  if(own)state=normalize(JSON.parse(own));else if(legacy&&!last){state=normalize(JSON.parse(legacy))}else state=defaultState();
  LS_KEY=keyFor(id);localStorage.setItem(LS_LAST,id);persistLocal();try{localStorage.removeItem(LS_LEGACY)}catch(e){}applyTheme();render()}
 else{LS_KEY=keyFor(id)}
 try{
  const {data:row,error}=await sb.from('aula_state').select('data,updated_at').eq('user_id',id).maybeSingle();

function autoShort(name){const w=name.replace(/\(.*?\)/g,'').split(/\s+/).filter(x=>x.length>2&&!/^(de|del|la|las|los|el|y|e|para|por|con|en)$/i.test(x));return w.slice(0,2).join(' ').slice(0,16)||name.slice(0,12)}
function addSubjects(rows){const existing=new Set(state.subjects.map(s=>s.name.toLowerCase()));const ids=semIds();let n=0;rows.forEach((r,i)=>{if(!r.name||existing.has(r.name.toLowerCase()))return;let sem=r.semester;if(typeof sem==='number')sem='s'+sem;if(sem!=='anual'&&!ids.includes(sem))sem=ids[Math.min(ids.length-1,Math.max(0,(parseInt(sem)||1)-1))];state.subjects.push({id:uid(),name:r.name,short:r.short||autoShort(r.name),credits:Number(r.credits)||6,type:STYPE_ALL[r.type]?r.type:'OB',semester:sem,year:Number(r.year)||null,color:PALETTE[(state.subjects.length)%PALETTE.length],teacher:'',email:'',office:'',hours:'',room:'',link:'',notes:''});existing.add(r.name.toLowerCase());n++});if(n)save();return n}

/* ===================== Lógica académica ===================== */
const getSubject=id=>state.subjects.find(s=>s.id===id);
function semesterOn(iso){const s=state.settings.semesters.find(s=>s.start<=iso&&iso<=s.end);return s?s.id:null}
function currentSemester(){const a=state.settings.activeSemester;const S=state.settings.semesters;if(a&&a!=='auto'&&S.some(s=>s.id===a))return a;const t=todayISO();const s=semesterOn(t);if(s)return s;const up=S.find(s=>s.start>t);return up?up.id:S[S.length-1].id}
const subjActive=(sid,sem)=>{const s=getSubject(sid);return !!s&&(s.semester==='anual'||s.semester===sem)};
const isHoliday=iso=>state.settings.holidays.includes(iso);
function classesOn(iso){const sem=semesterOn(iso);if(!sem||isHoliday(iso))return[];const wd=dow(parseISO(iso));return state.classes.filter(c=>c.day===wd&&subjActive(c.subjectId,sem)).sort((a,b)=>toMin(a.start)-toMin(b.start))}
function classesForSem(sem){return state.classes.filter(c=>subjActive(c.subjectId,sem)).sort((a,b)=>a.day-b.day||toMin(a.start)-toMin(b.start))}
function attKey(cid,iso){return cid+'|'+iso}
function sessionsFor(sid){const subj=getSubject(sid);if(!subj)return[];const cls=state.classes.filter(c=>c.subjectId===sid);if(!cls.length)return[];const t=todayISO();const nowM=new Date().getHours()*60+new Date().getMinutes();const out=[];state.settings.semesters.filter(s=>subj.semester==='anual'||s.id===subj.semester).forEach(s=>{if(s.start>t)return;const end=s.end<t?s.end:t;for(let iso=s.start;iso<=end;iso=addDays(iso,1)){if(isHoliday(iso))continue;const wd=dow(parseISO(iso));cls.forEach(c=>{if(c.day!==wd)return;if(iso===t&&toMin(c.start)>nowM)return;out.push({cls:c,date:iso,status:state.attendance[attKey(c.id,iso)]||''})})}});return out.sort((a,b)=>b.date.localeCompare(a.date)||toMin(b.cls.start)-toMin(a.cls.start))}
function attStats(sid){const ss=sessionsFor(sid);const total=ss.length;const p=ss.filter(x=>x.status==='p').length,a=ss.filter(x=>x.status==='a').length,j=ss.filter(x=>x.status==='j').length;const pct=total?Math.round((total-a)/total*100):null;return{total,p,a,j,pct,unrec:total-p-a-j}}
function gradeStats(sid){const items=state.tasks.filter(t=>t.subjectId===sid&&Number(t.weight)>0).sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:1);const totalW=items.reduce((s,t)=>s+Number(t.weight),0);const graded=items.filter(t=>t.grade!=null&&t.grade!=='');const gW=graded.reduce((s,t)=>s+Number(t.weight),0);const pts=graded.reduce((s,t)=>s+Number(t.grade)*Number(t.weight),0);const avg=gW?pts/gW:null;const secured=pts/100;const remaining=Math.max(0,100-gW);const needFor=T=>remaining>0?(T*100-pts)/remaining:null;return{items,totalW,gW,avg,secured,remaining,needFor}}
function pendingTasks(sid){return state.tasks.filter(t=>!t.done&&!isExam(t)&&(!sid||t.subjectId===sid))}
function weekRange(iso){const d=parseISO(iso);const wd=dow(d);const mon=addDays(iso,1-wd);return{mon,sun:addDays(mon,6)}}
function studyMinutes(from,to){return state.study.filter(x=>x.date>=from&&x.date<=to).reduce((a,x)=>a+Number(x.minutes||0),0)}
function courseAverage(){let w=0,p=0,n=0;state.subjects.forEach(s=>{const g=gradeStats(s.id);if(g.avg!=null&&Number(s.credits)>0){w+=Number(s.credits);p+=g.avg*Number(s.credits);n++}});return n?{avg:p/w,n,ects:w}:null}
function attCalc(T,H,A,m){T=Math.max(0,Math.round(T));H=Math.min(T,Math.max(0,Math.round(H)));A=Math.min(H,Math.max(0,Math.round(A)));m=Math.min(100,Math.max(0,Number(m)||0));const maxAbs=Math.floor(T*(100-m)/100+1e-9);const left=maxAbs-A;const R=T-H;const mustAttend=Math.max(0,R-Math.max(0,left));const cur=H?(H-A)/H*100:null;const finalIfNoMore=T?(T-A)/T*100:null;const possible=left>=0;return{T,H,A,m,maxAbs,left,R,mustAttend,cur,finalIfNoMore,possible}}

const planKey=(pid,iso)=>pid+'|'+iso;
function planDoneOn(pid,iso){return !!state.planDone[planKey(pid,iso)]}
function markPlan(pid,iso){const p=state.plans.find(x=>x.id===pid);if(!p)return;const k=planKey(pid,iso);if(state.planDone[k]){delete state.planDone[k];state.study=state.study.filter(s=>!(s.planId===pid&&s.date===iso))}else{state.planDone[k]=true;state.study.push({id:uid(),subjectId:p.subjectId||'',minutes:toMin(p.end)-toMin(p.start),date:iso,at:Date.now(),planId:pid});toast('Sesión apuntada')}save();render()}

function examProgress(t){const it=t.items||[];const d=it.filter(x=>x.done).length;return{total:it.length,done:d,pct:it.length?Math.round(d/it.length*100):null}}
function examPace(t){const p=examProgress(t);if(!p.total)return '';const left=p.total-p.done;if(left<=0)return 'Temario completo ✓';if(!t.date)return left+' temas pendientes';const n=daysDiff(t.date);if(n<=0)return left+' temas pendientes';const per=left/n;return per>=1?Math.ceil(per)+' tema'+(Math.ceil(per)>1?'s':'')+' al día para llegar':'1 tema cada '+Math.max(1,Math.floor(n/left))+' días es suficiente'}

 <div class="cols2"><label class="field"><span>Faltas hasta ahora</span><input id="ta-A" type="number" inputmode="numeric" min="0" value="${A}" oninput="calcAtt()"></label><label class="field"><span>Asistencia mínima (%)</span><input id="ta-m" type="number" inputmode="numeric" min="0" max="100" value="${m}" oninput="calcAtt()"></label></div>

function calcAtt(){const g=id=>Number($('#'+id).value);const out=$('#ta-out');if(!out)return;const r=attCalc(g('ta-T'),g('ta-H'),g('ta-A'),g('ta-m'));
 const pct=v=>v==null?'–':(Math.round(v*10)/10).toLocaleString('es-ES')+'%';
 let verdict='';if(!r.T){verdict=''}else if(!r.possible){verdict=`<div class="verdict bad">Ya has superado el máximo de faltas (${r.maxAbs}). Aunque no faltes más, acabarías con ${pct(r.finalIfNoMore)}, por debajo del ${r.m}%.</div>`}else if(r.left===0){verdict=`<div class="verdict warn">No puedes faltar ni una vez más: tienes que ir a las ${r.R} sesiones que quedan.</div>`}else{verdict=`<div class="verdict ok">Vas bien: puedes faltar ${r.left} ${r.left===1?'vez':'veces'} más y seguir por encima del ${r.m}%.</div>`}
 out.innerHTML=`<div class="card tool-out"><div class="res"><div><b>${pct(r.cur)}</b><span>Asistencia actual (${r.H-r.A} de ${r.H})</span></div><div><b>${r.maxAbs}</b><span>Faltas permitidas en total</span></div><div><b style="color:${r.left<0?'var(--red)':r.left===0?'var(--amber)':'var(--green)'}">${r.left<0?'0':r.left}</b><span>Faltas que te quedan</span></div><div><b>${r.mustAttend}<small style="font-size:14px;color:var(--ink-3)"> / ${r.R}</small></b><span>Sesiones restantes a las que debes ir</span></div><div class="wide"><b>${pct(r.finalIfNoMore)}</b><span>Asistencia final si no faltas ninguna más</span></div></div>${verdict}</div>`}

function calcNota(){const out=$('#tn-out');if(!out)return;const avg=parseFloat($('#tn-avg').value),w=parseFloat($('#tn-w').value),t=parseFloat($('#tn-t').value),x=parseFloat($('#tn-x').value);
 if(isNaN(avg)||isNaN(w)){out.innerHTML='';return}
 const pts=avg*w/100;const rem=100-w;const need=T=>rem>0?(T*100-avg*w)/rem:null;const fmtN=v=>v==null?'–':v<=0?'Ya lo tienes':v>10?'Imposible':n1(v);
 const cls=v=>v==null?'':v<=0?'var(--green)':v>10?'var(--red)':v>8.5?'var(--amber)':'inherit';

function fmtClock(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function ringPct(){const tot=(tm.mode==='focus'?tm.focus:tm.brk)*60;return Math.round((1-tm.remaining/tot)*100)}
function timerStart(){if(tm.running)return;tm.running=true;tm.endAt=Date.now()+tm.remaining*1000;clearInterval(tm.iv);tm.iv=setInterval(timerTick,500);render()}
function timerPause(){tm.running=false;clearInterval(tm.iv);timerTick();render()}
function timerReset(){tm.running=false;clearInterval(tm.iv);tm.remaining=(tm.mode==='focus'?tm.focus:tm.brk)*60;render()}
function timerSkip(){timerFinish(true)}
function timerTick(){if(tm.running)tm.remaining=Math.max(0,Math.round((tm.endAt-Date.now())/1000));const d=$('#tm-digits');if(d){d.textContent=fmtClock(tm.remaining);const r=$('#tm-ring');if(r)r.style.setProperty('--p',ringPct()+'%')}document.title=(tm.running?fmtClock(tm.remaining)+' · ':'')+'Aula';if(tm.running&&tm.remaining<=0)timerFinish(false)}
function timerFinish(skipped){clearInterval(tm.iv);const wasFocus=tm.mode==='focus';if(wasFocus){const total=tm.focus*60;const spent=Math.round((total-(skipped?tm.remaining:0))/60);if(spent>=1){state.study.push({id:uid(),subjectId:tm.subjectId,minutes:spent,date:todayISO(),at:Date.now()});save()}tm.done++;tm.mode='break';tm.remaining=tm.brk*60;if(!skipped)beep();toast(spent>=1?'Bloque apuntado: '+spent+' min':'Descanso')}else{tm.mode='focus';tm.remaining=tm.focus*60;if(!skipped)beep();toast('Descanso terminado')}
 tm.running=false;if(!skipped&&wasFocus){tm.running=true;tm.endAt=Date.now()+tm.remaining*1000;tm.iv=setInterval(timerTick,500)}
 if(ui.route==='tool'&&ui.param==='timer')render()}
function beep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.15);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.16)})}catch(e){}if(navigator.vibrate)navigator.vibrate([150,80,150])}

async function exportData(){const json=JSON.stringify(state,null,2);const name='aula-copia-'+todayISO()+'.json';
 {try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Copia exportada');return}catch(e){}}

function openTaskForm(id,pre){
 pre=pre||{};const t=id?state.tasks.find(x=>x.id===id):{title:'',subjectId:pre.subjectId||'',type:pre.type||'tarea',date:pre.date||'',time:'',priority:1,done:false,notes:'',weight:pre.weight!=null?pre.weight:'',grade:'',room:''};

 <div class="cols2"><label class="field"><span>Peso en la nota final (%)</span><input id="f-weight" type="number" min="0" max="100" step="0.5" value="${t.weight==null?'':t.weight}" placeholder="Ej. 40" inputmode="decimal"></label><label class="field"><span>Nota obtenida (sobre 10)</span><input id="f-grade" type="number" min="0" max="10" step="0.01" value="${t.grade==null?'':t.grade}" placeholder="Cuando la sepas" inputmode="decimal"></label></div>

 ${id?`<div class="row" style="margin-top:18px"><button class="btn block" onclick="dupTask('${id}')">Duplicar</button><button class="btn danger block" onclick="deleteTask('${id}')">Eliminar</button></div>`:''}`;
 formItems=(t.items||[]).map(x=>({id:x.id||uid(),name:x.name,done:!!x.done}));
 openSheet(id?(ex?'Editar examen':'Editar tarea'):(ex?'Nuevo examen':'Nueva tarea'),body,()=>{let title=ex?'':val('f-title');if(ex){if(!val('f-subj')){toast('Elige la asignatura');return false}}else if(!title){toast('Pon un título');return false}const w=val('f-weight'),g=val('f-grade');if(g!==''&&(+g<0||+g>10)){toast('La nota va de 0 a 10');return false}const o={title,subjectId:val('f-subj'),type:val('f-ttype'),etype:ex?val('f-etype'):undefined,date:val('f-date')||null,time:val('f-time')||null,priority:$('#f-pri')?+val('f-pri'):(t.priority||1),room:$('#f-room')?val('f-room'):(t.room||''),notes:val('f-tnotes'),weight:w===''?null:+w,grade:g===''?null:+g,items:formItems.filter(x=>x.name.trim()).map(x=>({id:x.id,name:x.name.trim(),done:!!x.done}))};if(ex)o.title=examTitle(o);if(g!==''&&!id)o.done=true;if(id){Object.assign(state.tasks.find(x=>x.id===id),o)}else{o.id=uid();o.done=o.done||false;o.createdAt=Date.now();state.tasks.push(o)}save();toast(id?(ex?'Examen guardado':'Tarea guardada'):(ex?'Examen añadido':'Tarea añadida'));return true});
 renderItems();
}
let formItems=[];

function deleteTask(id){const x=state.tasks.find(t=>t.id===id);state.tasks=state.tasks.filter(t=>t.id!==id);save();closeSheet();render();toast((x&&isExam(x)?'Examen':'Tarea')+' eliminado'+(x&&isExam(x)?'':'a'))}

function diagInfo(){const el=$('#diag');if(!el)return;const p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);width:env(safe-area-inset-bottom,0px);visibility:hidden';document.body.appendChild(p);const r=p.getBoundingClientRect();p.remove();const vv=window.visualViewport;el.textContent='Diagnóstico · ventana '+window.innerWidth+'×'+window.innerHeight+' · visible '+(vv?Math.round(vv.width)+'×'+Math.round(vv.height)+' (top '+Math.round(vv.offsetTop)+')':'–')+' · pantalla '+screen.width+'×'+screen.height+' · zonas seguras '+Math.round(r.height)+'/'+Math.round(r.width)+' · html '+document.documentElement.clientHeight+' · body '+document.body.clientHeight+' · app '+($('#app')?$('#app').clientHeight:0)+' · barra '+($('.tabbar')?Math.round($('.tabbar').getBoundingClientRect().bottom):0)+' · scroll '+window.scrollY+' · aplicada '+lastH+' · '+(window.navigator.standalone?'instalada':'navegador')}
function safeTop(){const p=document.createElement('div');p.style.cssText='position:absolute;top:0;left:0;height:env(safe-area-inset-top,0px);width:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none';document.body.appendChild(p);const r=p.getBoundingClientRect();p.remove();return {top:Math.round(r.height),bottom:Math.round(r.width)}}
let lastH=0;
function kbSafe(){try{return typeof kbOpen==='function'&&kbOpen()}catch(e){return false}}
function realHeight(){const vv=window.visualViewport;let h=Math.round(vv?vv.height:window.innerHeight)||window.innerHeight;if(kbSafe()&&lastH)return lastH;const portrait=window.innerHeight>=window.innerWidth;const sh=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);const st=safeTop().top;
 // iOS instalada con barra translúcida: el contenido va bajo el reloj pero la ventana se declara más baja de lo que es
 if(navigator.standalone&&st>0&&sh>h&&sh-h<=st+2)h=sh;
 return h}
function fitHeight(){const hh=realHeight();if(!hh)return;lastH=hh;document.documentElement.style.height=hh+'px';document.body.style.height=hh+'px';if(!kbSafe())window.scrollTo(0,0)}
fitHeight();window.addEventListener('resize',fitHeight);window.addEventListener('orientationchange',()=>{setTimeout(fitHeight,350);setTimeout(fitHeight,900)});if(window.visualViewport){window.visualViewport.addEventListener('resize',fitHeight)}document.addEventListener('focusout',()=>{setTimeout(fitHeight,120);setTimeout(fitHeight,500)});document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(fitHeight,100)});window.addEventListener('pageshow',fitHeight);setTimeout(fitHeight,300);setTimeout(fitHeight,1200);

function countUp(){document.querySelectorAll('.stat b, .grade-big .g b').forEach(el=>{const txt=el.textContent.trim();if(!/^\d{1,3}$/.test(txt))return;const n=+txt;if(!n)return;const t0=performance.now();const d=420;const f=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()});r.addEventListener('updatefound',()=>{const nw=r.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const b=document.createElement('button');b.className='btn primary';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 14px);z-index:65;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)';b.textContent='Hay una versión nueva · Actualizar';b.onclick=()=>location.reload();document.body.appendChild(b)}})})}).catch(()=>{})})}

document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;if(e.key==='Escape'&&$('#backdrop').classList.contains('open')){closeSheet();return}if(typing||e.metaKey||e.ctrlKey||e.altKey||$('#backdrop').classList.contains('open'))return;const k=e.key.toLowerCase();const routes=['hoy','horario','tareas','calendario','estudio','asignaturas','mas'];if(/^[1-7]$/.test(k)){go(routes[+k-1]);return}if(k==='n'){openTaskForm();e.preventDefault()}else if(k==='e'){openTaskForm(null,{type:'examen'});e.preventDefault()}else if(k==='c'){openClassForm();e.preventDefault()}});
(function(){let x0=null,y0=null;document.addEventListener('touchstart',e=>{if($('#backdrop').classList.contains('open'))return;const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});document.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.7)return;const dir=dx<0?1:-1;
 if(ui.route==='horario'&&ui.ttMode==='dia'){const max=state.settings.showSat?6:5;ui.day=Math.min(max,Math.max(1,(ui.day||1)+dir));ui.noAnim=true;render()}
 else if(ui.route==='tool'&&ui.param==='plan'){ui.planDay=Math.min(7,Math.max(1,(ui.planDay||1)+dir));ui.noAnim=true;render()}
 else if(ui.route==='tool'&&ui.param==='planestudios'&&catalogFor()){const ys=Object.keys(catalogFor().years).map(Number);const i=ys.indexOf(ui.peYear);const j=Math.min(ys.length-1,Math.max(0,i+dir));ui.peYear=ys[j];ui.noAnim=true;render()}
 else if(ui.route==='calendario'){const [y,m]=ui.calMonth.split('-').map(Number);ui.calMonth=dir>0?(m===12?(y+1)+'-01':y+'-'+pad(m+1)):(m===1?(y-1)+'-12':y+'-'+pad(m-1));ui.noAnim=true;render()}},{passive:true})})();
document.addEventListener('focusin',e=>{const t=(e.target.tagName||'').toLowerCase();if((t==='input'||t==='textarea')&&window.innerWidth<960&&!['checkbox','radio','date','time'].includes(e.target.type))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;const t=(a&&a.tagName||'').toLowerCase();if(!(t==='input'||t==='textarea')&&!kbOpen())document.body.classList.remove('kb')},60)});

let vvBase=0;function kbOpen(){const vv=window.visualViewport;if(!vv)return false;vvBase=Math.max(vvBase,vv.height);return vv.height<vvBase*0.78}
if(window.visualViewport){vvBase=window.visualViewport.height;const onVV=()=>{if(window.innerWidth>=960)return;if(kbOpen())document.body.classList.add('kb');else{const a=document.activeElement;const t=(a&&a.tagName||'').toLowerCase();if(!(t==='input'||t==='textarea'))document.body.classList.remove('kb')}fitHeight()};window.visualViewport.addEventListener('resize',onVV);window.visualViewport.addEventListener('scroll',onVV);window.addEventListener('orientationchange',()=>{vvBase=0;setTimeout(()=>{vvBase=window.visualViewport.height},400)});window.visualViewport.addEventListener('resize',()=>{if(!kbOpen()){window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}});window.visualViewport.addEventListener('scroll',()=>{if(!kbOpen())window.scrollTo(0,0)})}
