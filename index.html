<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#5B4BE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aula · Organizador universitario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F4F4FA;--card:#FFFFFF;--card-2:#F0F0F8;--ink:#15162B;--ink-2:#3B3F5A;--ink-3:#5F6482;--line:#E2E2EE;--edge:rgba(40,40,90,.06);--fs:16px;
  --navy:#5B4BE8;--navy-2:#8B5CF6;--navy-3:#EC4899;--on-navy:#FFFFFF;--on-navy-2:rgba(255,255,255,.78);
  --sun:#FFD166;--blue:#4F46E5;--red:#EF4466;--green:#16A37A;--amber:#F59E0B;--t-blue:#E9E8FF;--t-green:#DDF7EE;--t-amber:#FFF1DA;--t-pink:#FFE4F0;--t-sky:#E0F2FE;
  --r:20px;--tab:66px;--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F0F1A;--card:#1A1A2B;--card-2:#222237;--ink:#F5F5FC;--ink-2:#C9CBDD;--ink-3:#9EA2BC;--line:#30304A;--edge:#2A2A44;--navy:#6D5DF0;--navy-2:#9D6BFF;--navy-3:#F472B6;--sun:#FFD166;--t-blue:rgba(99,91,255,.18);--t-green:rgba(22,163,122,.18);--t-amber:rgba(245,158,11,.18);--t-pink:rgba(236,72,153,.18);--t-sky:rgba(14,165,233,.18);--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--paper:#0F0F1A;--card:#1A1A2B;--card-2:#222237;--ink:#F5F5FC;--ink-2:#C9CBDD;--ink-3:#9EA2BC;--line:#30304A;--edge:#2A2A44;--navy:#6D5DF0;--navy-2:#9D6BFF;--navy-3:#F472B6;--sun:#FFD166;--t-blue:rgba(99,91,255,.18);--t-green:rgba(22,163,122,.18);--t-amber:rgba(245,158,11,.18);--t-pink:rgba(236,72,153,.18);--t-sky:rgba(14,165,233,.18);--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
body{font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:var(--fs);line-height:1.55;font-weight:500;min-height:100%;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 24px);font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.12}
h2{font-size:1.2em;font-weight:800;letter-spacing:-.015em;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:18px;border-radius:4px;background:linear-gradient(var(--navy),var(--navy-3));flex:none}
h2 small{font-weight:700;color:var(--ink-3);font-size:.78em;margin-left:6px}
h3{font-size:15px;font-weight:800}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:.94em;line-height:1.5}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid var(--edge)}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.86em;font-weight:700;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card-2);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 8px 20px -10px rgba(91,75,232,.6)}
.btn.blue{background:var(--blue);color:#fff}
.btn.soft{background:var(--t-blue);color:var(--navy)}
.btn.danger{background:rgba(229,72,77,.12);color:var(--red)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.topbar h1{font-size:24px}
.iconbtn{width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
/* Hero */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 58%,var(--navy-3) 135%);color:var(--on-navy);border-radius:0 0 30px 30px;padding:18px 18px 24px;margin:0 -16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-30px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,209,102,.22)}
.hero .hello{font-size:1.05em;font-weight:700;color:rgba(255,255,255,.9);margin-top:14px}
.hero .hello+.status{margin-top:6px}
.hero>*{position:relative;z-index:1}
.hero .date{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--on-navy-2);font-size:.84em;font-weight:700}
.hero .status{margin-top:16px;font-size:.9em;font-weight:800;color:var(--sun);display:flex;align-items:center;gap:8px}
.hero .status .pulse{width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 0 rgba(255,196,61,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,196,61,.6)}70%{box-shadow:0 0 0 10px rgba(255,196,61,0)}100%{box-shadow:0 0 0 0 rgba(255,196,61,0)}}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-top:8px}
.hero .meta{color:rgba(255,255,255,.88);font-size:1em;margin-top:10px;font-weight:600;line-height:1.45}
.hero .bar{height:6px;background:rgba(255,255,255,.14);border-radius:4px;margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--sun);border-radius:4px;transition:width .6s}
.hero .count{display:flex;justify-content:space-between;font-size:.86em;color:rgba(255,255,255,.88);margin-top:6px;font-weight:700}
.sync{display:inline-flex;align-items:center;gap:6px}
.acct{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.acct img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.2)}
.hero .acct>span{display:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--card-2);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.cloud .d{background:var(--green)}
.sync.error .d{background:var(--red)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;border:1px solid var(--edge)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:.86em;color:var(--ink-2);font-weight:700;line-height:1.3;display:block;margin-top:2px}
.stat.c1{background:var(--t-blue)}.stat.c2{background:var(--t-green)}.stat.c3{background:var(--t-amber)}
.stat .em{font-size:16px;line-height:1;margin-bottom:6px;display:block}
/* Class rows */
.cls{display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 14px 12px;margin-top:10px;border:1px solid var(--edge)}
.cls .bar{width:5px;border-radius:4px;flex:none}
.cls .time{width:62px;flex:none;font-weight:800;font-size:1em;line-height:1.2}
.cls .time small{display:block;color:var(--ink-3);font-weight:700;font-size:.88em;margin-top:2px}
.cls .name{font-weight:800;font-size:1.05em;line-height:1.3}
.cls .info{color:var(--ink-2);font-size:.94em;margin-top:4px;line-height:1.45}
.cls.now{outline:2px solid var(--sun)}
.cls.past{opacity:.6}
.att{display:flex;gap:6px;margin-top:10px}
.att button{flex:1;padding:10px 6px;border-radius:12px;font-size:.9em;font-weight:700;background:var(--card-2);color:var(--ink-2)}
.att button.on-p{background:var(--t-green);color:var(--green)}
.att button.on-a{background:var(--t-pink);color:var(--red)}
.att button.on-j{background:var(--t-amber);color:var(--amber)}
/* Tasks */
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:10px;border:1px solid var(--edge)}
.task .box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.task .box svg{width:14px;height:14px;display:none}
.task.done .box{background:var(--green);border-color:var(--green);color:#fff}
.task .m .ty{display:inline-flex;align-items:center;gap:4px}
.task.done .box svg{display:block}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.task .t{font-weight:800;font-size:1.05em;line-height:1.35}
.task .m{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px;align-items:center;font-size:.9em;color:var(--ink-2);font-weight:700}
.task .m .late{color:var(--red)}
.task .pri{width:6px;height:6px;border-radius:50%;flex:none;margin-top:9px}
.task .pri.p2{background:var(--red)}.task .pri.p1{background:var(--amber)}.task .pri.p0{background:transparent}
.grp{margin-top:22px;font-size:.92em;font-weight:800;color:var(--ink-3);letter-spacing:.01em}
.grp.late{color:var(--red)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:.94em;border:1px solid var(--edge);font-weight:700;color:var(--ink-2);white-space:nowrap}
.filters button.on{background:var(--navy);color:var(--on-navy)}
/* Day strip */
.days{display:flex;gap:6px;margin:8px 0 4px}
.days button{flex:1;padding:11px 0 9px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:1em;border:1px solid var(--edge);color:var(--ink-2);line-height:1.1}
.days button small{display:block;font-size:.76em;color:var(--ink-3);font-weight:700;margin-top:2px}
.days button.on{background:var(--navy);color:var(--on-navy)}
.days button.on small{color:var(--on-navy-2)}
.days button.today:not(.on){box-shadow:inset 0 0 0 2px var(--sun)}
.seg{display:inline-flex;background:var(--card-2);border-radius:10px;padding:3px}
.seg button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* Week grid */
.tt{overflow-x:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 8px 12px;border:1px solid var(--edge)}
.tt-in{display:grid;grid-template-columns:34px repeat(var(--cols),minmax(58px,1fr));gap:3px;min-width:100%}
.tt .hd{font-size:.78em;font-weight:800;color:var(--ink-3);text-align:center;padding-bottom:4px}
.tt .hd.today{color:var(--ink)}
.tt .col{position:relative;height:var(--h);background:var(--card-2);border-radius:8px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour))}
.tt .hours{position:relative;height:var(--h)}
.tt .hours span{position:absolute;left:0;right:0;font-size:10px;font-weight:700;color:var(--ink-3);text-align:right;padding-right:4px;transform:translateY(-6px)}
.tt .blk{position:absolute;left:2px;right:2px;border-radius:7px;padding:4px 5px;font-size:10px;line-height:1.2;color:#fff;overflow:hidden;font-weight:800;cursor:pointer}
.tt .blk small{display:block;font-weight:600;opacity:.85;font-size:9px;margin-top:1px}
/* Calendar */
.cal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border:1px solid var(--edge)}
.cal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .nav b{font-size:16px;font-weight:800;text-transform:capitalize}
.cal .wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--ink-3);font-weight:800;text-align:center;margin-bottom:4px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;color:var(--ink)}
.cal .day.out{color:var(--ink-3);opacity:.5}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--sun)}
.cal .day.sel{background:var(--navy);color:var(--on-navy)}
.cal .day.hol{color:var(--red)}
.cal .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.cal .day.hascls::before{content:"";position:absolute;top:4px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--ink-3);opacity:.6}
/* Subjects */
.subj{display:flex;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:10px;align-items:center;border:1px solid var(--edge)}
.subj .ab{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}
.subj .n{font-weight:800;font-size:1.05em}
.subj .s{font-size:.9em;color:var(--ink-2);margin-top:2px;font-weight:700}
.subj .k{text-align:right;flex:none}
.subj .k b{display:block;font-size:17px;font-weight:800}
.subj .k span{font-size:11px;color:var(--ink-3);font-weight:700}
.shead{border-radius:0 0 28px 28px;margin:0 -16px;padding:14px 16px 20px;color:#fff;position:relative}
.shead h1{font-size:24px}
.shead .sub{color:rgba(255,255,255,.8);margin-top:4px}
.shead .backrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.shead .backrow button{color:#fff;background:rgba(255,255,255,.18);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.tabs2{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;border:1px solid var(--edge);color:var(--ink-2);white-space:nowrap}
.tabs2 button.on{background:var(--navy);color:var(--on-navy)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:.96em}
.kv dt{color:var(--ink-3);font-weight:700;font-size:.9em}
.kv dd{font-weight:600;word-break:break-word}
.grade-big{display:flex;gap:10px;margin-top:10px}
.grade-big .g{flex:1;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border:1px solid var(--edge)}
.grade-big .g b{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.grade-big .g span{font-size:.86em;color:var(--ink-2);font-weight:700}
.ev{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .w{font-size:.88em;color:var(--ink-3);font-weight:700;margin-top:2px}
.ev .g{font-weight:800;font-size:17px;min-width:44px;text-align:right}
.ev .g.na{color:var(--ink-3);font-weight:700;font-size:13px}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.needs div{background:var(--card-2);border-radius:12px;padding:10px;text-align:center}
.needs b{display:block;font-size:18px;font-weight:800}
.needs span{font-size:.82em;color:var(--ink-2);font-weight:700}
.sess{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.96em}
.sess:last-child{border-bottom:0}
.sess .att{margin:0;flex:none;width:150px}
textarea.notes{width:100%;min-height:220px;border:0;background:transparent;resize:vertical;line-height:1.5;outline:none}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2);font-weight:600;font-size:.96em;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .em{font-size:34px;display:block;margin-bottom:8px;line-height:1}
.empty .btn{margin-top:14px}
/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:flex;height:var(--tab)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74em;font-weight:800;color:var(--ink-3)}
.tabbar button .ic{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ic{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .tabbar button.on .ic{background:var(--sun);color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar button.on .ic{background:var(--sun);color:#111}}
.fab{position:fixed;right:18px;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 16px);width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;box-shadow:0 10px 26px -8px rgba(91,75,232,.7);z-index:41;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
@media (min-width:700px){.fab{right:calc(50% - 320px + 18px)}}
/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.backdrop.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:10px}
.sheet .sh b{font-size:17px;font-weight:800}
.sheet .sb{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}

function sessionsFor(sid){const subj=getSubject(sid);if(!subj)return[];const cls=state.classes.filter(c=>c.subjectId===sid);if(!cls.length)return[];const t=todayISO();const nowM=new Date().getHours()*60+new Date().getMinutes();const out=[];state.settings.semesters.filter(s=>subj.semester==='anual'||s.id===subj.semester).forEach(s=>{if(s.start>t)return;const end=s.end<t?s.end:t;for(let iso=s.start;iso<=end;iso=addDays(iso,1)){if(isHoliday(iso))continue;const wd=dow(parseISO(iso));cls.forEach(c=>{if(c.day!==wd)return;if(iso===t&&toMin(c.start)>nowM)return;out.push({cls:c,date:iso,status:state.attendance[attKey(c.id,iso)]||''})})}});return out.sort((a,b)=>b.date.localeCompare(a.date)||toMin(b.cls.start)-toMin(a.cls.start))}
function attStats(sid){const ss=sessionsFor(sid);const total=ss.length;const p=ss.filter(x=>x.status==='p').length,a=ss.filter(x=>x.status==='a').length,j=ss.filter(x=>x.status==='j').length;const pct=total?Math.round((total-a)/total*100):null;return{total,p,a,j,pct,unrec:total-p-a-j}}
function gradeStats(sid){const items=state.tasks.filter(t=>t.subjectId===sid&&Number(t.weight)>0).sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:1);const totalW=items.reduce((s,t)=>s+Number(t.weight),0);const graded=items.filter(t=>t.grade!=null&&t.grade!=='');const gW=graded.reduce((s,t)=>s+Number(t.weight),0);const pts=graded.reduce((s,t)=>s+Number(t.grade)*Number(t.weight),0);const avg=gW?pts/gW:null;const secured=pts/100;const remaining=Math.max(0,100-gW);const needFor=T=>remaining>0?(T*100-pts)/remaining:null;return{items,totalW,gW,avg,secured,remaining,needFor}}
function pendingTasks(sid){return state.tasks.filter(t=>!t.done&&(!sid||t.subjectId===sid))}
function weekRange(iso){const d=parseISO(iso);const wd=dow(d);const mon=addDays(iso,1-wd);return{mon,sun:addDays(mon,6)}}
function studyMinutes(from,to){return state.study.filter(x=>x.date>=from&&x.date<=to).reduce((a,x)=>a+Number(x.minutes||0),0)}
function courseAverage(){let w=0,p=0,n=0;state.subjects.forEach(s=>{const g=gradeStats(s.id);if(g.avg!=null&&Number(s.credits)>0){w+=Number(s.credits);p+=g.avg*Number(s.credits);n++}});return n?{avg:p/w,n,ects:w}:null}
function attCalc(T,H,A,m){T=Math.max(0,Math.round(T));H=Math.min(T,Math.max(0,Math.round(H)));A=Math.min(H,Math.max(0,Math.round(A)));m=Math.min(100,Math.max(0,Number(m)||0));const maxAbs=Math.floor(T*(100-m)/100+1e-9);const left=maxAbs-A;const R=T-H;const mustAttend=Math.max(0,R-Math.max(0,left));const cur=H?(H-A)/H*100:null;const finalIfNoMore=T?(T-A)/T*100:null;const possible=left>=0;return{T,H,A,m,maxAbs,left,R,mustAttend,cur,finalIfNoMore,possible}}
function plansOn(day){return state.plans.filter(p=>p.day===day).sort((a,b)=>toMin(a.start)-toMin(b.start))}
const planKey=(pid,iso)=>pid+'|'+iso;

function weekPlanned(){return state.plans.reduce((a,p)=>a+toMin(p.end)-toMin(p.start),0)}
function examProgress(t){const it=t.items||[];const d=it.filter(x=>x.done).length;return{total:it.length,done:d,pct:it.length?Math.round(d/it.length*100):null}}
function examPace(t){const p=examProgress(t);if(!p.total)return '';const left=p.total-p.done;if(left<=0)return 'Temario completo ✓';if(!t.date)return left+' temas pendientes';const n=daysDiff(t.date);if(n<=0)return left+' temas pendientes';const per=left/n;return per>=1?Math.ceil(per)+' tema'+(Math.ceil(per)>1?'s':'')+' al día para llegar':'1 tema cada '+Math.max(1,Math.floor(n/left))+' días es suficiente'}
function upcomingExams(){const t=todayISO();return state.tasks.filter(x=>x.type==='examen'&&!x.done&&x.date&&x.date>=t).sort((a,b)=>a.date.localeCompare(b.date))}

function weekHours(){const {mon}=weekRange(todayISO());let m=0;for(let i=0;i<7;i++){classesOn(addDays(mon,i)).forEach(c=>m+=toMin(c.end)-toMin(c.start))}return m}

function calcAtt(){const g=id=>Number($('#'+id).value);const out=$('#ta-out');if(!out)return;const r=attCalc(g('ta-T'),g('ta-H'),g('ta-A'),g('ta-m'));
 const pct=v=>v==null?'–':(Math.round(v*10)/10).toLocaleString('es-ES')+'%';
 let verdict='';if(!r.T){verdict=''}else if(!r.possible){verdict=`<div class="verdict bad">Ya has superado el máximo de faltas (${r.maxAbs}). Aunque no faltes más, acabarías con ${pct(r.finalIfNoMore)}, por debajo del ${r.m}%.</div>`}else if(r.left===0){verdict=`<div class="verdict warn">No puedes faltar ni una vez más: tienes que ir a las ${r.R} sesiones que quedan.</div>`}else{verdict=`<div class="verdict ok">Vas bien: puedes faltar ${r.left} ${r.left===1?'vez':'veces'} más y seguir por encima del ${r.m}%.</div>`}
 out.innerHTML=`<div class="card tool-out"><div class="res"><div><b>${pct(r.cur)}</b><span>Asistencia actual (${r.H-r.A} de ${r.H})</span></div><div><b>${r.maxAbs}</b><span>Faltas permitidas en total</span></div><div><b style="color:${r.left<0?'var(--red)':r.left===0?'var(--amber)':'var(--green)'}">${r.left<0?'0':r.left}</b><span>Faltas que te quedan</span></div><div><b>${r.mustAttend}<small style="font-size:14px;color:var(--ink-3)"> / ${r.R}</small></b><span>Sesiones restantes a las que debes ir</span></div><div class="wide"><b>${pct(r.finalIfNoMore)}</b><span>Asistencia final si no faltas ninguna más</span></div></div>${verdict}</div>`}

function toolNota(){
 let avg='',gW='',sw=false;
 if(ui.toolSubj&&getSubject(ui.toolSubj)){const g=gradeStats(ui.toolSubj);if(g.avg!=null){avg=Math.round(g.avg*100)/100;gW=g.gW;sw=true}}
 let html=toolHead('Calculadora de nota','¿Qué necesitas en lo que queda para llegar a tu objetivo?');

 <div class="cols2"><label class="field"><span>Media de lo ya evaluado (0–10)</span><input id="tn-avg" type="number" inputmode="decimal" step="0.01" min="0" max="10" value="${avg}" placeholder="Ej. 6,4" oninput="calcNota()"></label><label class="field"><span>Porcentaje ya evaluado (%)</span><input id="tn-w" type="number" inputmode="numeric" min="0" max="100" value="${gW}" placeholder="Ej. 40" oninput="calcNota()"></label></div>
 <div class="cols2"><label class="field"><span>Objetivo</span><input id="tn-t" type="number" inputmode="decimal" step="0.1" min="0" max="10" value="5" oninput="calcNota()"></label><label class="field"><span>Si sacas esto en el resto…</span><input id="tn-x" type="number" inputmode="decimal" step="0.1" min="0" max="10" value="" placeholder="Ej. 7" oninput="calcNota()"></label></div>
 ${sw?'':'<div class="hint">Ejemplo: parcial 30% con un 6 y práctica 10% con un 8 → media de lo evaluado 6,5 y 40% evaluado.</div>'}</div></div><div class="col"><div id="tn-out"></div></div></div>`;
 setTimeout(calcNota,0);return html;
}
function calcNota(){const out=$('#tn-out');if(!out)return;const avg=parseFloat($('#tn-avg').value),w=parseFloat($('#tn-w').value),t=parseFloat($('#tn-t').value),x=parseFloat($('#tn-x').value);
 if(isNaN(avg)||isNaN(w)){out.innerHTML='';return}
 const pts=avg*w/100;const rem=100-w;const need=T=>rem>0?(T*100-avg*w)/rem:null;const fmtN=v=>v==null?'–':v<=0?'Ya lo tienes':v>10?'Imposible':n1(v);
 const cls=v=>v==null?'':v<=0?'var(--green)':v>10?'var(--red)':v>8.5?'var(--amber)':'inherit';
 const final=!isNaN(x)&&rem>0?pts+x*rem/100:null;
 out.innerHTML=`<div class="card tool-out"><div class="res"><div class="wide"><b>${n1(pts)}<small style="font-size:14px;color:var(--ink-3)"> / 10</small></b><span>Puntos ya asegurados · queda el ${rem}% por evaluar</span></div><div><b style="color:${cls(need(t||0))}">${fmtN(need(t||0))}</b><span>Para un ${n1(t||0)}</span></div><div><b style="color:${cls(need(5))}">${fmtN(need(5))}</b><span>Aprobado (5)</span></div><div><b style="color:${cls(need(7))}">${fmtN(need(7))}</b><span>Notable (7)</span></div><div><b style="color:${cls(need(9))}">${fmtN(need(9))}</b><span>Sobresaliente (9)</span></div>${final!=null?`<div class="wide"><b>${n1(final)}</b><span>Nota final si sacas un ${n1(x)} en el ${rem}% restante → ${final>=9?'sobresaliente':final>=7?'notable':final>=5?'aprobado':'suspenso'}</span></div>`:''}</div>${rem===0?'<div class="verdict ok">Ya está todo evaluado: tu nota final es '+n1(pts)+'.</div>':''}</div>`}

const tm={running:false,endAt:0,remaining:25*60,mode:'focus',focus:25,brk:5,iv:null,subjectId:'',done:0};
function toolTimer(){
 let html=toolHead('Temporizador de estudio','Bloques de concentración con descansos. Cada bloque se apunta en tu registro.');
 html+=`<div class="cols"><div class="col"><div class="card timer"><div class="ring ${tm.mode==='break'?'break':''}" id="tm-ring" style="--p:${ringPct()}%"><div class="digits" id="tm-digits">${fmtClock(tm.remaining)}</div><div class="mode" id="tm-mode">${tm.mode==='focus'?'Concentración':'Descanso'}${tm.done?' · bloque '+(tm.done+1):''}</div></div>
 <div class="ctl">${tm.running?`<button class="btn" onclick="timerPause()">Pausar</button>`:`<button class="btn primary" onclick="timerStart()">${tm.remaining<(tm.mode==='focus'?tm.focus:tm.brk)*60?'Continuar':'Empezar'}</button>`}<button class="btn" onclick="timerReset()">Reiniciar</button><button class="btn ghost" onclick="timerSkip()">Saltar</button></div></div>`;
 html+=`</div><div class="col"><div class="card tool-out"><label class="field" style="margin-top:0"><span>Asignatura que estás estudiando</span><select onchange="tm.subjectId=this.value"><option value="">— Sin asignatura —</option>${state.subjects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${tm.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
 <div class="cols2"><label class="field"><span>Minutos de concentración</span><select onchange="tm.focus=+this.value;if(!tm.running&&tm.mode==='focus'){tm.remaining=tm.focus*60;render()}">${[15,20,25,30,40,45,50,60,90].map(v=>`<option ${tm.focus===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Minutos de descanso</span><select onchange="tm.brk=+this.value;if(!tm.running&&tm.mode==='break'){tm.remaining=tm.brk*60;render()}">${[3,5,10,15,20].map(v=>`<option ${tm.brk===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
 <div class="hint">El temporizador sigue aunque cambies de pantalla dentro de la app. Si cierras la pestaña, se detiene.</div></div>`;
 const t=todayISO();const td=studyMinutes(t,t);const {mon,sun}=weekRange(t);
 html+=`<div class="res" style="margin-top:12px"><div style="background:var(--card);box-shadow:var(--shadow);border:1px solid var(--edge)"><b>${fmtDur(td)}</b><span>Estudiado hoy</span></div><div style="background:var(--card);box-shadow:var(--shadow);border:1px solid var(--edge)"><b>${fmtDur(studyMinutes(mon,sun))}</b><span>Esta semana</span></div></div>`;

}
function fmtClock(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function ringPct(){const tot=(tm.mode==='focus'?tm.focus:tm.brk)*60;return Math.round((1-tm.remaining/tot)*100)}
function timerStart(){if(tm.running)return;tm.running=true;tm.endAt=Date.now()+tm.remaining*1000;clearInterval(tm.iv);tm.iv=setInterval(timerTick,500);render()}
function timerPause(){tm.running=false;clearInterval(tm.iv);timerTick();render()}
function timerReset(){tm.running=false;clearInterval(tm.iv);tm.remaining=(tm.mode==='focus'?tm.focus:tm.brk)*60;render()}
function timerSkip(){timerFinish(true)}
function timerTick(){if(tm.running)tm.remaining=Math.max(0,Math.round((tm.endAt-Date.now())/1000));const d=$('#tm-digits');if(d){d.textContent=fmtClock(tm.remaining);const r=$('#tm-ring');if(r)r.style.setProperty('--p',ringPct()+'%')}document.title=(tm.running?fmtClock(tm.remaining)+' · ':'')+'Aula';if(tm.running&&tm.remaining<=0)timerFinish(false)}
function timerFinish(skipped){clearInterval(tm.iv);const wasFocus=tm.mode==='focus';if(wasFocus){const total=tm.focus*60;const spent=Math.round((total-(skipped?tm.remaining:0))/60);if(spent>=1){state.study.push({id:uid(),subjectId:tm.subjectId,minutes:spent,date:todayISO(),at:Date.now()});save()}tm.done++;tm.mode='break';tm.remaining=tm.brk*60;if(!skipped)beep();toast(spent>=1?'Bloque apuntado: '+spent+' min':'Descanso')}else{tm.mode='focus';tm.remaining=tm.focus*60;if(!skipped)beep();toast('A por otro bloque')}
 tm.running=false;if(!skipped&&wasFocus){tm.running=true;tm.endAt=Date.now()+tm.remaining*1000;tm.iv=setInterval(timerTick,500)}
 if(ui.route==='tool'&&ui.param==='timer')render()}
function beep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.15);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.16)})}catch(e){}if(navigator.vibrate)navigator.vibrate([150,80,150])}
function openStudyForm(){openSheet('Apuntar sesión de estudio',`<label class="field" style="margin-top:0"><span>Asignatura</span><select id="f-subj"><option value="">— Sin asignatura —</option>${state.subjects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${tm.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><div class="cols2"><label class="field"><span>Minutos</span><input id="f-min" type="number" inputmode="numeric" min="1" value="60"></label><label class="field"><span>Fecha</span><input id="f-date" type="date" value="${todayISO()}"></label></div>`,()=>{const m=+val('f-min');if(!m||m<1){toast('Pon los minutos');return false}state.study.push({id:uid(),subjectId:val('f-subj'),minutes:m,date:val('f-date')||todayISO(),at:Date.now()});save();toast('Sesión apuntada');return true})}

 html+=`<h2>Datos</h2><div class="list"><button class="it" onclick="exportData()"><div>Exportar copia de seguridad<span>Descarga un archivo JSON con todo</span></div>${I.chev}</button><button class="it" onclick="openImport()"><div>Importar copia<span>Pega el contenido de un JSON exportado</span></div>${I.chev}</button><button class="it" onclick="${state.settings.profile.setup?'openSetup(3)':'openSetup(1)'}"><div>Asistente de asignaturas<span>Plan oficial, sugerencia con IA o pegar una lista</span></div>${I.chev}</button><button class="it" style="color:var(--red)" onclick="wipeAll()"><div>Borrar todos los datos<span>No se puede deshacer</span></div>${I.chev}</button></div>`;
 html+=`</div></div>`;
 html+=`<div class="hint center" style="margin:24px 0 8px">Aula v${APP_VERSION} · ${APP_DATE} · NextWeb Studio</div>`;
 return html;
}
function setSem(i,k,v){if(!v)return;state.settings.semesters[i][k]=v;save();}
function applyTheme(){const th=state.settings.theme;if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);document.documentElement.style.setProperty('--fs',{small:'15px',normal:'16.5px',large:'18px',xl:'20px'}[state.settings.textSize]||'16.5px')}
async function exportData(){const json=JSON.stringify(state,null,2);const name='aula-copia-'+todayISO()+'.json';
 {try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Copia exportada');return}catch(e){}}
 try{await navigator.clipboard.writeText(json);toast('No se pudo descargar: copiado al portapapeles');return}catch(e){}
 openSheet('Copia de seguridad',`<div class="hint">Copia este texto y guárdalo en un archivo .json</div><label class="field"><textarea style="min-height:260px;font-size:12px" readonly>${esc(json)}</textarea></label>`,null,'Cerrar')}
function openImport(){openSheet('Importar copia',`<div class="hint">Pega aquí el contenido del archivo JSON exportado. Se sustituirán todos los datos actuales.</div><label class="field"><textarea id="imp" style="min-height:220px;font-size:12px" placeholder='{"v":1, ...}'></textarea></label>`,()=>{try{const o=JSON.parse($('#imp').value);if(!o||typeof o!=='object'||!Array.isArray(o.subjects))throw 0;state=normalize(o);save();applyTheme();toast('Datos importados');return true}catch(e){toast('El texto no es una copia válida');return false}},'Importar')}
function wipeAll(){confirmBox('¿Borrar todos los datos?','Se eliminarán asignaturas, horario, tareas, notas y asistencia.',()=>{state=defaultState();save();applyTheme();go('hoy');render();toast('Datos borrados')})}

/* ===================== Hoja (sheet) ===================== */
let sheetSave=null;
function openSheet(title,body,onSave,saveLabel){$('#sh-title').textContent=title;$('#sh-body').innerHTML=body;sheetSave=onSave;const b=$('#sh-save');b.textContent=saveLabel||'Guardar';b.style.display=onSave?'':'none';$('#sh-cancel').textContent=onSave?'Cancelar':'Cerrar';if(!onSave&&saveLabel){b.style.display='';b.textContent=saveLabel;sheetSave=()=>true}$('#backdrop').classList.add('open');document.body.style.overflow='hidden';const f=$('#sh-body').querySelector('input:not([type=hidden]),textarea');if(f&&window.innerWidth>700)setTimeout(()=>f.focus(),50)}
function closeSheet(){$('#backdrop').classList.remove('open');document.body.style.overflow='';sheetSave=null}
$('#sh-cancel').onclick=closeSheet;
$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeSheet()});
$('#sh-save').onclick=()=>{if(!sheetSave){closeSheet();return}const ok=sheetSave();if(ok!==false){closeSheet();render()}};
function confirmBox(title,text,onYes){openSheet(title,`<div class="sub" style="margin:4px 0 14px">${text}</div><button class="btn danger block" id="cb-yes">Sí, continuar</button>`,null);$('#sh-save').style.display='none';$('#cb-yes').onclick=()=>{closeSheet();onYes()}}
const val=id=>{const el=$('#'+id);return el?el.value.trim():''};
function subjOptions(sel,allowNone){return (allowNone?`<option value="">— Sin asignatura —</option>`:'')+state.subjects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}

/* ---- Asignatura ---- */
function openSubjectForm(id){
 const s=id?getSubject(id):{name:'',short:'',color:PALETTE[state.subjects.length%PALETTE.length],credits:6,type:'OB',semester:currentSemester(),teacher:'',email:'',office:'',hours:'',room:'',link:'',notes:''};
 const body=`<label class="field" style="margin-top:0"><span>Nombre *</span><input id="f-name" value="${esc(s.name)}" placeholder="Ej. Contabilidad de Costes"></label>
 <label class="field"><span>Abreviatura (para el horario)</span><input id="f-short" value="${esc(s.short)}" maxlength="16" placeholder="Ej. C. Costes"></label>
 <div class="field"><span>Color</span><div class="swatches" id="f-sw">${PALETTE.map(c=>`<button type="button" style="background:${c}" class="${c===s.color?'on':''}" onclick="pickColor(this,'${c}')" aria-label="Color"></button>`).join('')}</div><input type="hidden" id="f-color" value="${s.color}"></div>
 <div class="cols3"><label class="field"><span>ECTS</span><input id="f-credits" type="number" step="0.5" min="0" value="${s.credits}"></label><label class="field"><span>Tipo</span><select id="f-type">${Object.entries(STYPE_ALL).map(x=>`<option value="${x[0]}" ${s.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class="field"><span>Periodo</span><select id="f-sem">${state.settings.semesters.map(p=>`<option value="${p.id}" ${s.semester===p.id?'selected':''}>${esc(semShort(p.id))}</option>`).join('')}<option value="anual" ${s.semester==='anual'?'selected':''}>Anual</option></select></label></div>
 <label class="field"><span>Profesor/a</span><input id="f-teacher" value="${esc(s.teacher)}"></label>
 <div class="cols2"><label class="field"><span>Email</span><input id="f-email" type="email" value="${esc(s.email)}" inputmode="email"></label><label class="field"><span>Despacho</span><input id="f-office" value="${esc(s.office)}"></label></div>
 <label class="field"><span>Tutorías</span><input id="f-hours" value="${esc(s.hours)}" placeholder="Ej. Martes 12:00–14:00 (cita previa)"></label>
 <div class="cols2"><label class="field"><span>Aula habitual</span><input id="f-room" value="${esc(s.room)}"></label><label class="field"><span>Enlace (campus virtual)</span><input id="f-link" type="url" value="${esc(s.link)}" placeholder="https://"></label></div>
 <label class="field"><span>Notas</span><textarea id="f-notes" placeholder="Bibliografía, normas del profesor, grupo de prácticas…">${esc(s.notes)}</textarea></label>
 ${id?`<button class="btn danger block" style="margin-top:18px" onclick="deleteSubject('${id}')">Eliminar asignatura</button>`:''}`;
 openSheet(id?'Editar asignatura':'Nueva asignatura',body,()=>{const name=val('f-name');if(!name){toast('Pon un nombre');return false}const o={name,short:val('f-short')||name.split(' ').filter(w=>w.length>2).slice(0,2).join(' ').slice(0,16),color:val('f-color'),credits:+val('f-credits')||0,type:val('f-type'),semester:val('f-sem'),teacher:val('f-teacher'),email:val('f-email'),office:val('f-office'),hours:val('f-hours'),room:val('f-room'),link:val('f-link'),notes:val('f-notes')};if(id){Object.assign(getSubject(id),o)}else{o.id=uid();state.subjects.push(o);state.settings.hideTemplate=true}save();toast(id?'Asignatura guardada':'Asignatura creada');return true});
}
function pickColor(btn,c){document.querySelectorAll('#f-sw button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');$('#f-color').value=c}
function deleteSubject(id){const s=getSubject(id);closeSheet();confirmBox('¿Eliminar '+s.name+'?','Se borrarán también sus clases, tareas, notas y asistencia.',()=>{state.subjects=state.subjects.filter(x=>x.id!==id);const cids=state.classes.filter(c=>c.subjectId===id).map(c=>c.id);state.classes=state.classes.filter(c=>c.subjectId!==id);state.tasks=state.tasks.filter(t=>t.subjectId!==id);Object.keys(state.attendance).forEach(k=>{if(cids.includes(k.split('|')[0]))delete state.attendance[k]});delete state.notes[id];save();go('asignaturas');render();toast('Asignatura eliminada')})}

/* ---- Clase ---- */
function openClassForm(id,pre){
 if(!state.subjects.length){toast('Crea primero una asignatura');openSubjectForm();return}
 pre=pre||{};const c=id?state.classes.find(x=>x.id===id):{subjectId:pre.subjectId||state.subjects[0].id,day:pre.day||(ui.day||1),start:'09:00',end:'10:30',kind:'teoria',room:'',note:''};
 const maxDay=state.settings.showSat?6:5;
 const body=`<label class="field" style="margin-top:0"><span>Asignatura</span><select id="f-subj">${subjOptions(c.subjectId)}</select></label>
 <label class="field"><span>Día</span><select id="f-day">${Array.from({length:maxDay},(_,i)=>i+1).map(d=>`<option value="${d}" ${c.day===d?'selected':''}>${DAYS[d]}</option>`).join('')}</select></label>
 <div class="cols2"><label class="field"><span>Empieza</span><input id="f-start" type="time" value="${c.start}" step="300"></label><label class="field"><span>Termina</span><input id="f-end" type="time" value="${c.end}" step="300"></label></div>
 <div class="cols2"><label class="field"><span>Tipo</span><select id="f-kind">${Object.entries(KINDS).map(x=>`<option value="${x[0]}" ${c.kind===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class="field"><span>Aula</span><input id="f-room" value="${esc(c.room)}" placeholder="Ej. Aula 2.4"></label></div>
 <label class="field"><span>Nota</span><input id="f-note" value="${esc(c.note||'')}" placeholder="Ej. Grupo B, llevar portátil…"></label>
 <div class="hint">La clase se repite cada semana dentro del cuatrimestre de la asignatura.</div>
 ${id?`<button class="btn danger block" style="margin-top:18px" onclick="deleteClass('${id}')">Eliminar clase</button>`:''}`;
 openSheet(id?'Editar clase':'Nueva clase',body,()=>{const o={subjectId:val('f-subj'),day:+val('f-day'),start:val('f-start'),end:val('f-end'),kind:val('f-kind'),room:val('f-room'),note:val('f-note')};if(!o.start||!o.end){toast('Pon hora de inicio y fin');return false}if(toMin(o.end)<=toMin(o.start)){toast('La hora de fin debe ser posterior');return false}const clash=state.classes.find(x=>x.id!==id&&x.day===o.day&&toMin(x.start)<toMin(o.end)&&toMin(o.start)<toMin(x.end)&&subjActive(x.subjectId,(getSubject(o.subjectId)||{}).semester)&&(getSubject(x.subjectId)||{}).semester!=='anual');if(clash){const cs=getSubject(clash.subjectId);toast('Se solapa con '+(cs?cs.short||cs.name:'otra clase')+' ('+clash.start+'–'+clash.end+')')}if(id){Object.assign(state.classes.find(x=>x.id===id),o)}else{o.id=uid();state.classes.push(o)}save();if(ui.route==='horario'){ui.day=o.day;ui.ttSem=(getSubject(o.subjectId)||{}).semester==='s2'?'s2':ui.ttSem}return true});
}
function deleteClass(id){closeSheet();confirmBox('¿Eliminar esta clase?','Se borrará del horario junto con su asistencia.',()=>{state.classes=state.classes.filter(c=>c.id!==id);Object.keys(state.attendance).forEach(k=>{if(k.startsWith(id+'|'))delete state.attendance[k]});save();render()})}

/* ---- Tarea ---- */
function openTaskForm(id,pre){
 pre=pre||{};const t=id?state.tasks.find(x=>x.id===id):{title:'',subjectId:pre.subjectId||'',type:pre.type||'tarea',date:pre.date||'',time:'',priority:1,done:false,notes:'',weight:pre.weight!=null?pre.weight:'',grade:''};
 const body=`<label class="field" style="margin-top:0"><span>Título *</span><input id="f-title" value="${esc(t.title)}" placeholder="Ej. Entrega práctica 2 / Examen parcial"></label>
 <div class="cols2"><label class="field"><span>Asignatura</span><select id="f-subj">${subjOptions(t.subjectId,true)}</select></label><label class="field"><span>Tipo</span><select id="f-ttype" onchange="renderItems()">${Object.entries(TYPES).map(x=>`<option value="${x[0]}" ${t.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label></div>
 <div class="cols2"><label class="field"><span>Fecha</span><input id="f-date" type="date" value="${t.date||''}"></label><label class="field"><span>Hora</span><input id="f-time" type="time" value="${t.time||''}"></label></div>
 <label class="field"><span>Prioridad</span><select id="f-pri"><option value="0" ${t.priority==0?'selected':''}>Baja</option><option value="1" ${t.priority==1?'selected':''}>Media</option><option value="2" ${t.priority==2?'selected':''}>Alta</option></select></label>
 <div class="cols2"><label class="field"><span>Peso en la nota final (%)</span><input id="f-weight" type="number" min="0" max="100" step="0.5" value="${t.weight==null?'':t.weight}" placeholder="Ej. 40" inputmode="decimal"></label><label class="field"><span>Nota obtenida (sobre 10)</span><input id="f-grade" type="number" min="0" max="10" step="0.01" value="${t.grade==null?'':t.grade}" placeholder="Cuando la sepas" inputmode="decimal"></label></div>
 <div class="field"><span id="f-items-label">${t.type==='examen'?'Temario (temas que entran)':'Lista de pasos'}</span><div id="f-items-wrap"></div></div>
 <label class="field"><span>Notas</span><textarea id="f-tnotes" placeholder="Formato de entrega, enlace, dudas…">${esc(t.notes||'')}</textarea></label>
 ${id?`<div class="row" style="margin-top:18px"><button class="btn block" onclick="dupTask('${id}')">Duplicar</button><button class="btn danger block" onclick="deleteTask('${id}')">Eliminar</button></div>`:''}`;
 formItems=(t.items||[]).map(x=>({id:x.id||uid(),name:x.name,done:!!x.done}));
 openSheet(id?'Editar tarea':'Nueva tarea',body,()=>{const title=val('f-title');if(!title){toast('Pon un título');return false}const w=val('f-weight'),g=val('f-grade');if(g!==''&&(+g<0||+g>10)){toast('La nota va de 0 a 10');return false}const o={title,subjectId:val('f-subj'),type:val('f-ttype'),date:val('f-date')||null,time:val('f-time')||null,priority:+val('f-pri'),notes:val('f-tnotes'),weight:w===''?null:+w,grade:g===''?null:+g,items:formItems.filter(x=>x.name.trim()).map(x=>({id:x.id,name:x.name.trim(),done:!!x.done}))};if(g!==''&&!id)o.done=true;if(id){Object.assign(state.tasks.find(x=>x.id===id),o)}else{o.id=uid();o.done=o.done||false;o.createdAt=Date.now();state.tasks.push(o)}save();toast(id?'Guardado':'Tarea creada');return true});
 renderItems();
}
let formItems=[];
function renderItems(){const w=$('#f-items-wrap');if(!w)return;const type=$('#f-ttype')?$('#f-ttype').value:'tarea';const lab=$('#f-items-label');if(lab)lab.textContent=type==='examen'?'Temario (temas que entran)':'Lista de pasos';w.innerHTML=formItems.map((it,i)=>`<div class="ck ${it.done?'done':''}"><button type="button" class="cb ${it.done?'on':''}" onclick="formItems[${i}].done=!formItems[${i}].done;renderItems()" aria-label="Hecho">${I.check}</button><input value="${esc(it.name)}" oninput="formItems[${i}].name=this.value" placeholder="${type==='examen'?'Ej. Tema 3: Oferta y demanda':'Ej. Buscar bibliografía'}"><button type="button" class="x" onclick="formItems.splice(${i},1);renderItems()" aria-label="Quitar">×</button></div>`).join('')+`<button type="button" class="btn small" style="margin-top:10px" onclick="formItems.push({id:uid(),name:'',done:false});renderItems();setTimeout(()=>{const ins=document.querySelectorAll('#f-items-wrap input');if(ins.length)ins[ins.length-1].focus()},30)">+ Añadir ${type==='examen'?'tema':'paso'}</button>${formItems.length>1?`<div class="hint">${formItems.filter(x=>x.done).length} de ${formItems.length} completados</div>`:''}`}
function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();closeSheet();render();toast('Tarea eliminada')}
function dupTask(id){const t=state.tasks.find(x=>x.id===id);const o=Object.assign({},t,{id:uid(),done:false,doneAt:null,grade:null,createdAt:Date.now(),title:t.title+' (copia)'});state.tasks.push(o);save();closeSheet();render();toast('Duplicada')}

/* ===================== FAB ===================== */
$('#fab').onclick=()=>{const d=ui.route==='calendario'&&ui.calSel?ui.calSel:'';const sid=ui.route==='asignatura'?ui.param:'';openSheet('Añadir',`<div class="menu"><button onclick="closeSheet();openTaskForm(null,{date:'${d}',subjectId:'${sid}'})"><i>${I.tareas}</i><div>Tarea, entrega o examen<span>Con fecha, prioridad y peso en la nota</span></div></button><button onclick="closeSheet();openClassForm(null,{subjectId:'${sid}'})"><i>${I.horario}</i><div>Clase en el horario<span>Se repite cada semana</span></div></button><button onclick="closeSheet();openPlanForm(null,{subjectId:'${sid}'})"><i>📖</i><div>Sesión de estudio<span>Planifica cuándo estudias cada cosa</span></div></button><button onclick="closeSheet();openSubjectForm()"><i>${I.asig}</i><div>Asignatura<span>Profesor, créditos, tutorías…</span></div></button></div>`,null)};

/* ===================== Inicio ===================== */
loadLocal();applyTheme();render();initCloud();
(function(){try{const el=$('#au-ver');if(el)el.textContent='Versión '+APP_VERSION+' · '+APP_DATE;const prev=localStorage.getItem('aula.version');if(prev&&prev!==APP_VERSION)setTimeout(()=>toast('Aula actualizada a la versión '+APP_VERSION+' ✨'),800);localStorage.setItem('aula.version',APP_VERSION)}catch(e){}})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()});r.addEventListener('updatefound',()=>{const nw=r.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const b=document.createElement('button');b.className='btn primary';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 14px);z-index:65;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)';b.textContent='Hay una versión nueva · Actualizar';b.onclick=()=>location.reload();document.body.appendChild(b)}})})}).catch(()=>{})})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRemote()});
window.addEventListener('online',()=>{if(cloud.pending)flushCloud()});
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;if(e.key==='Escape'&&$('#backdrop').classList.contains('open')){closeSheet();return}if(typing||e.metaKey||e.ctrlKey||e.altKey||$('#backdrop').classList.contains('open'))return;const k=e.key.toLowerCase();const routes=['hoy','horario','tareas','calendario','asignaturas','mas'];if(/^[1-6]$/.test(k)){go(routes[+k-1]);return}if(k==='n'){openTaskForm();e.preventDefault()}else if(k==='c'){openClassForm();e.preventDefault()}});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!$('#backdrop').classList.contains('open'))render()},200)});
setInterval(()=>{if(ui.route==='hoy'&&!$('#backdrop').classList.contains('open'))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.route==='hoy'&&!$('#backdrop').classList.contains('open'))render()});
</script>
</body>
</html>
